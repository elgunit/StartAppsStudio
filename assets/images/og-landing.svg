<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ship your product in weeks — Start Apps Studio</title>
  <desc id="desc">Founder-led product studio for non-technical founders.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#dce9e5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#b7d7d0" stop-opacity=".28"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <circle cx="1040" cy="95" r="180" fill="#8ad3c8" opacity=".34" filter="url(#blur)"/>
  <circle cx="280" cy="570" r="145" fill="#e6a0b0" opacity=".22" filter="url(#blur)"/>
